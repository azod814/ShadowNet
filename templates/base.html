<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}ShadowNet{% endblock %}</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/dashboard.css') }}">

    {% block head %}{% endblock %}
</head>

<body>

    <nav class="topbar">
        <a href="/" class="brand">
            <div class="brand-icon">
                <i class="fa-solid fa-layer-group"></i>
            </div>

            <div>
                <strong>ShadowNet</strong>
                <span>Website Replica Studio</span>
            </div>
        </a>

        <div class="nav-right">
            <span class="engine-status">
                <span class="status-dot"></span>
                Engine Ready
            </span>

            <button class="about-trigger" id="aboutBtn">
                <i class="fa-regular fa-circle-question"></i>
                About
            </button>
        </div>
    </nav>

    {% block content %}{% endblock %}

    <div class="modal-backdrop hidden" id="aboutModal">
        <div class="about-modal">
            <button class="close-modal" id="closeAbout">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <div class="about-logo">
                <i class="fa-solid fa-layer-group"></i>
            </div>

            <h2>ShadowNet</h2>
            <p class="about-subtitle">
                Website Replica Studio
            </p>

            <p>
                A local tool for analyzing and reconstructing
                public or authorized website layouts.
            </p>

            <div class="author-box">
                <span>Created by</span>
                <strong>AZOD814 (Suryansh)</strong>
            </div>
        </div>
    </div>

    <div id="toastContainer"
         class="toast-container"></div>

    <script src="{{ url_for('static',
        filename='js/dashboard.js') }}"></script>

    {% block scripts %}{% endblock %}

</body>
</html>
