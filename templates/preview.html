<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        ShadowNet Preview
    </title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #eef2f7;
            font-family: Arial, sans-serif;
        }

        .preview-bar {
            position: sticky;
            top: 0;
            z-index: 9999;

            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 12px 20px;

            background: #ffffff;
            border-bottom: 1px solid #dfe5ee;

            box-shadow:
                0 4px 20px rgba(15, 23, 42, 0.06);
        }

        .brand {
            font-weight: 800;
            color: #172033;
        }

        .brand span {
            color: #5b6cff;
        }

        .status {
            color: #64748b;
            font-size: 13px;
        }

        iframe {
            width: 100%;
            height: calc(100vh - 56px);

            border: none;
            background: white;
        }
    </style>
</head>

<body>

    <div class="preview-bar">

        <div class="brand">
            Shadow<span>Net</span>
            · Local Preview
        </div>

        <div class="status">
            {{ page["title"] }}
        </div>

    </div>

    <iframe
        src="/preview/{{ project_id }}/page/{{ page['id'] }}">
    </iframe>

</body>
</html>
