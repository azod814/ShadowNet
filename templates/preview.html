<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        ShadowNet Preview
    </title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #eef2f7;
            font-family:
                Arial,
                sans-serif;
        }

        .preview-bar {
            position: sticky;
            top: 0;
            z-index: 9999;

            display: flex;
            justify-content: space-between;
            align-items: center;

            min-height: 56px;

            padding: 12px 20px;

            background: #ffffff;

            border-bottom:
                1px solid #dfe5ee;

            box-shadow:
                0 4px 20px
                rgba(15, 23, 42, 0.06);
        }

        .brand {
            font-weight: 800;
            color: #172033;
        }

        .brand span {
            color: #5b6cff;
        }

        .status {
            overflow: hidden;

            max-width: 50%;

            color: #64748b;

            text-overflow: ellipsis;
            white-space: nowrap;

            font-size: 13px;
        }

        iframe {
            display: block;

            width: 100%;
            height: calc(100vh - 56px);

            border: none;

            background: #ffffff;
        }

        @media (max-width: 600px) {

            .preview-bar {
                padding: 12px 14px;
            }

            .status {
                max-width: 45%;
                font-size: 12px;
            }

        }
    </style>
</head>

<body>

    <div class="preview-bar">

        <div class="brand">
            Shadow<span>Net</span>
            · Local Preview
        </div>

        <div class="status">
            {{ page["title"] }}
        </div>

    </div>


    <iframe
        src="{{ page_preview_url }}">
    </iframe>

</body>
</html>
